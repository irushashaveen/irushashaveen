      <text x="60" y="137" font-size="57" font-weight="700" letter-spacing="-1.5" fill="#f8fafc">Irusha Shaveen</text>
      <text x="64" y="177" font-size="18" fill="#cbd5e1">Full-stack applications · API integrations · Test automation</text>
      <text x="64" y="217" font-size="14" fill="#94a3b8">Software Engineering undergraduate, SLIIT  /  Sri Lanka</text>
    </g>
    <g fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.5">
