<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="270" viewBox="0 0 1100 270" role="img" aria-labelledby="title description">
  <title id="title">Irusha Shaveen — Software Developer</title>
  <desc id="description">Software Developer and Software Engineering undergraduate at SLIIT, Sri Lanka. Full-stack applications, API integrations and test automation.</desc>
  <defs>
