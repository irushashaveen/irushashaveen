    <rect x="700" width="400" height="270" fill="url(#grid)" />
    <circle cx="1070" cy="25" r="190" fill="none" stroke="#5eead4" stroke-width="1" opacity="0.12" />
    <circle cx="1070" cy="25" r="155" fill="none" stroke="#5eead4" stroke-width="1" opacity="0.08" />
